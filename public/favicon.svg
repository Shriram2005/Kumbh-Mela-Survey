<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="coconutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Background Saffron Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Holy River Sangam Waves -->
  <path d="M 10 54.5 C 17.5 52, 24.5 56.5, 32 54 C 39.5 51.5, 46.5 56, 54 53.5" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 15 58 C 21 56, 26 59, 32 57.5 C 38 56, 43 59, 49 57" 
        fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>

  <!-- Mango Leaves (Sacred Amra Pallava) -->
  <path d="M 27 23 C 21 21, 14 18, 13 13 C 18 13, 23 17, 27 21 Z" fill="#22C55E"/>
  <path d="M 37 23 C 43 21, 50 18, 51 13 C 46 13, 41 17, 37 21 Z" fill="#22C55E"/>

  <!-- Sacred Coconut (Shriphala) -->
  <path d="M 32 8 C 37 14, 38 18, 38 23 C 38 24, 26 24, 26 23 C 26 18, 27 14, 32 8 Z" fill="url(#coconutGrad)"/>
  <path d="M 32 12 C 34 15, 34.5 18, 34.5 21 C 34.5 22, 29.5 22, 29.5 21 C 29.5 18, 30 15, 32 12 Z" fill="#F59E0B"/>

  <!-- Kumbha Rim / Mouth -->
  <rect x="21" y="22" width="22" height="3.5" rx="1.75" fill="#FFFFFF"/>
  <path d="M 25 25.5 H 39 V 28 H 25 Z" fill="#FFFFFF"/>

  <!-- Kumbha Pot Body (Sacred Urn) -->
  <path d="M 25 27.5 
           C 25 30.5, 15 33.5, 15 40 
           C 15 45.5, 21.5 48.5, 23.5 49 
           L 40.5 49 
           C 42.5 48.5, 49 45.5, 49 40 
           C 49 33.5, 39 30.5, 39 27.5 
           Z" 
        fill="#FFFFFF"/>

  <!-- Pedestal -->
  <rect x="23" y="48.5" width="18" height="3" rx="1.5" fill="#FFFFFF"/>

  <!-- Sacred Tilak / Sun on Pot -->
  <circle cx="32" cy="38.5" r="4.2" fill="#EA580C"/>
  <circle cx="32" cy="38.5" r="1.8" fill="#FFF9C4"/>
</svg>
